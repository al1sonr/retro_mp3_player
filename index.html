<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winamp MP3 Player</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .winamp-container {
            width: 380px;
            background: linear-gradient(135deg, #4c4c4c 0%, #2c2c2c 50%, #131313 100%);
            border: 3px solid #666;
            border-top-color: #888;
            border-left-color: #888;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            padding: 12px;
        }

        .chassis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #000080 0%, #000046 100%);
            color: #fff;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border: 1px solid #000033;
        }

        .lcd-screen {
            background-color: #000;
            border: 2px inset #444;
            padding: 8px 10px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 8px rgba(0,255,0,0.2);
        }

        .lcd-display-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .status-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333;
            border: 1px solid #111;
        }

        .status-led.active {
            background-color: #00ff00;
            box-shadow: 0 0 6px #00ff00;
        }

        .time-display {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        .track-title {
            font-size: 12px;
            color: #00ff00;
            text-shadow: 0 0 4px #00ff00;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 6px;
        }

        .retro-btn {
            background: linear-gradient(180deg, #e6e6e6 0%, #a6a6a6 100%);
            border: 2px outset #ffffff;
            color: #000;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            flex: 1;
            text-align: center;
            border-radius: 2px;
        }

        .retro-btn:active {
            border-style: inset;
            background: #888;
            color: #fff;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: #222;
            padding: 6px 10px;
            border: 1px inset #444;
        }

        .volume-label {
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
        }

        .volume-slider {
            flex: 1;
            accent-color: #00ff00;
            cursor: pointer;
        }

        .playlist-window {
            background-color: #000;
            border: 2px inset #444;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
        }

        .playlist-window::-webkit-scrollbar {
            width: 8px;
        }

        .playlist-window::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        .playlist-item {
            font-size: 11px;
            color: #00ff00;
            padding: 4px 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid #111;
        }

        .playlist-item:hover {
            background-color: #113311;
        }

        .playlist-item.active {
            background-color: #000080;
            color: #ffffff;
            font-weight: bold;
            text-shadow: none;
        }

        .footer-controls {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="winamp-container">
        <div class="chassis-header">
            <span>WINAMP - THIRD EYE BLIND (1997)</span>
            <span>___ X</span>
        </div>

        <div class="lcd-screen">
            <div class="lcd-display-top">
                <div class="status-led" id="status-led"></div>
                <div class="time-display" id="time-display">00:00</div>
            </div>
            <div class="track-title" id="track-title">01. Select or play a track</div>
        </div>

        <audio id="audio-player"></audio>

        <div class="controls-row">
            <button class="retro-btn" id="prev-btn">PREV</button>
            <button class="retro-btn" id="play-btn">PLAY</button>
            <button class="retro-btn" id="pause-btn">PAUSE</button>
            <button class="retro-btn" id="stop-btn">STOP</button>
            <button class="retro-btn" id="next-btn">NEXT</button>
        </div>

        <div class="volume-container">
            <span class="volume-label">VOL</span>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <div class="playlist-window" id="playlist-window">
            <!-- Playlist items populate dynamically -->
        </div>

        <div class="footer-controls">
            <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
            <button class="retro-btn" id="add-file-btn" style="flex: none;">+ ADD FILE(S)</button>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const trackTitle = document.getElementById('track-title');
        const timeDisplay = document.getElementById('time-display');
        const statusLed = document.getElementById('status-led');
        const playlistWindow = document.getElementById('playlist-window');
        const volumeSlider = document.getElementById('volume-slider');

        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        const fileInput = document.getElementById('file-input');
        const addFileBtn = document.getElementById('add-file-btn');

        // Full Third Eye Blind (1997) Album Playlist Array
  let playlist = [
    { title: '01. Losing A Whole Year', src: 'album/Third Eye Blind - Third Eye Blind - 01 Losing A Whole Year.mp3' },
    { title: '02. Narcolepsy', src: 'album/Third Eye Blind - Third Eye Blind - 02 Narcolepsy.mp3' },
    { title: '03. Semi-Charmed Life', src: 'album/Third Eye Blind - Third Eye Blind - 03 Semi-Charmed Life.mp3' },
    { title: '04. Jumper', src: 'album/Third Eye Blind - Third Eye Blind - 04 Jumper.mp3' },
    { title: '05. Graduate', src: 'album/Third Eye Blind - Third Eye Blind - 05 Graduate.mp3' },
    { title: '06. How\'s It Going To Be', src: 'album/Third Eye Blind - Third Eye Blind - 06 How\'s It Going To Be.mp3' },
    { title: '07. Thanks A Lot', src: 'album/Third Eye Blind - Third Eye Blind - 07 Thanks A Lot.m4a' },
    { title: '08. Burning Man', src: 'album/Third Eye Blind - Third Eye Blind - 08 Burning Man.m4a' },
    { title: '09. Good For You', src: 'album/Third Eye Blind - Third Eye Blind - 09 Good For You.mp3' },
    { title: '10. London', src: 'album/Third Eye Blind - Third Eye Blind - 10 London.mp3' },
    { title: '11. I Want You', src: 'album/Third Eye Blind - Third Eye Blind - 11 I Want You.mp3' },
    { title: '12. The Background', src: 'album/Third Eye Blind - Third Eye Blind - 12 The Background.mp3' },
    { title: '13. Motorcycle Drive By', src: 'album/Third Eye Blind - Third Eye Blind - 13 Motorcycle Drive By.mp3' },
    { title: '14. God Of Wine', src: 'album/Third Eye Blind - Third Eye Blind - 14 God Of Wine.mp3' }
];
        let currentTrackIndex = 0;

        function renderPlaylist() {
            playlistWindow.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentTrackIndex ? ' active' : '');
                item.textContent = track.title;
                item.addEventListener('click', () => {
                    loadAndPlayTrack(index);
                });
                playlistWindow.appendChild(item);
            });
        }

        function loadAndPlayTrack(index) {
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];
            audioPlayer.src = track.src;
            trackTitle.textContent = track.title;
            renderPlaylist();
            audioPlayer.load();
            audioPlayer.play().then(() => {
                statusLed.classList.add('active');
            }).catch(err => {
                console.warn('Playback deferred or file path not found:', err);
            });
        }

        playBtn.addEventListener('click', () => {
            if (!audioPlayer.src) {
                loadAndPlayTrack(0);
            } else {
                audioPlayer.play();
                statusLed.classList.add('active');
            }
        });

        pauseBtn.addEventListener('click', () => {
            audioPlayer.pause();
            statusLed.classList.remove('active');
        });

        stopBtn.addEventListener('click', () => {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            statusLed.classList.remove('active');
            timeDisplay.textContent = '00:00';
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadAndPlayTrack(currentTrackIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadAndPlayTrack(currentTrackIndex);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const mins = Math.floor(audioPlayer.currentTime / 60);
            const secs = Math.floor(audioPlayer.currentTime % 60);
            timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        audioPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadAndPlayTrack(currentTrackIndex);
        });

        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });

        addFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach((file) => {
                const objectUrl = URL.createObjectURL(file);
                playlist.push({
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    src: objectUrl
                });
            });

            renderPlaylist();

            // If nothing was playing before, automatically load the first newly added track
            if (!audioPlayer.src || audioPlayer.paused) {
                loadAndPlayTrack(playlist.length - files.length);
            }
        });

        // Initial render
        renderPlaylist();
    </script>
</body>
</html>
